[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lios"
version = "0.1.0"
description = "Living Intelligence Operating System — a reflective, non-authoritative substrate for tracking direction, trust, and shared understanding across personal, small-group, community, and societal scales."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Greg" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
